<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Films Admin · Uko's Diary</title><link rel="stylesheet" href="/_astro/admin.3FmOZC6n.css"></head> <body> <main class="admin-page"> <!-- =========================
       页面头部
  ========================== --> <header class="admin-header"> <div> <p class="admin-small-title">
UKO'S DIARY · ADMIN
</p> <h1>
Films
</h1> <p class="admin-description">
manage your movie records ♡
</p> </div> <div class="admin-header-actions"> <a href="/admin" class="back-admin-btn">
← Dashboard
</a> <button id="logout-btn" class="logout-btn">
Logout
</button> </div> </header> <!-- =========================
       电影管理
  ========================== --> <section class="admin-messages"> <div class="section-title"> <span>
MOVIE RECORDS
</span> <span>
your little cinema
</span> </div> <!-- 新增按钮 --> <div class="admin-content-actions"> <button id="add-film-btn" class="primary-admin-btn">
+ Add Film
</button> </div> <!-- 电影列表 --> <div id="films-list"> <div class="loading">
Loading films...
</div> </div> </section> <!-- =========================
       新增电影表单
  ========================== --> <section id="film-form-section" class="film-form-section" style="display:none;"> <div class="section-title"> <span id="film-form-title">
ADD A FILM
</span> <span id="film-form-subtitle">
a new little record
</span> </div> <form id="film-form"> <!-- 电影名称 --> <div class="input-group"> <label for="film-title">
Title
</label> <input id="film-title" type="text" placeholder="Movie title" required> </div> <!-- 导演 --> <div class="input-group"> <label for="film-director">
Director
</label> <input id="film-director" type="text" placeholder="Director" required> </div> <!-- 年份 --> <div class="input-group"> <label for="film-year">
Year
</label> <input id="film-year" type="number" placeholder="2026"> </div> <!-- 评分 --> <div class="input-group"> <label for="film-rating">
Rating
</label> <input id="film-rating" type="number" step="0.1" min="0" max="10" placeholder="9.0"> </div> <!-- 简介 --> <div class="input-group"> <label for="film-description">
Description
</label> <textarea id="film-description" placeholder="Write something about this film..." rows="6"></textarea> </div> <!-- 图片 --> <div class="input-group"> <label for="film-image">
Poster
</label> <input id="film-image" type="file" accept="image/*"> <small id="film-image-hint" class="upload-hint">
Image upload will be connected next.
</small> </div> <!-- 操作按钮 --> <div class="form-actions"> <button type="button" id="cancel-film-btn" class="secondary-admin-btn">
Cancel
</button> <button type="submit" id="save-film-btn" class="primary-admin-btn">
Save Film ♡
</button> </div> <p id="film-form-message" class="login-error"></p> </form> </section> </main> <script type="module" src="/_astro/films.astro_astro_type_script_index_0_lang.B3326xVJ.js"></script> </body> </html>
